name: Mercator CRM — CI Qualité & Sécurité

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Check (Lint)
        run: npm run lint

      - name: Run Unit, RBAC & Integration Tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Build Production Bundle
        run: npm run build
